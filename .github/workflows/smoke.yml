# Smoke test (project files smoke-test/plan.md): the C port still builds and its unit and rules tests pass.
# Frame-hash and boot checks use the retail ROM from the private vault (VAULT_TOKEN secret); skipped without it.
name: smoke
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 9 * * *'
  repository_dispatch:
    types: [disasm-changed]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update -q && sudo apt-get install -y -q libsdl2-dev
      - name: build the game C and the rules test (make test itself needs recorded captures, which are retail-derived)
        run: make build/captest build/rulestest
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no retail files in the repo
        run: |
          bad=$(git ls-files -s | awk '$1!="120000"{print $4}' | grep -iE '\.(sfc|smc|bin|iso|gen|wad|cmv|exe)$' | grep -viE '^(tools|third_party|ext)/' | while read -r f; do s=$(stat -c %s "$f" 2>/dev/null || echo 0); [ "$s" -gt 200000 ] && echo "$f"; done || true)
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
  rom:
    runs-on: ubuntu-latest
    env:
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    steps:
      - name: skip without vault access
        if: env.VAULT_TOKEN == ''
        run: echo "VAULT_TOKEN not set, ROM checks skipped"
      - uses: actions/checkout@v4
        if: env.VAULT_TOKEN != ''
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        if: env.VAULT_TOKEN != ''
        with:
          repository: abdulahmad/EA-NHL-Disassembly-Project
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault
          sparse-checkout: NHL94-Genesis/nhl94retail.bin
          sparse-checkout-cone-mode: false
      - name: full build and frame-hash check
        if: env.VAULT_TOKEN != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libsdl2-dev
          cp vault/NHL94-Genesis/nhl94retail.bin ./nhl94retail.bin
          make -j4 && make rulestest golden-check
  netsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: netplay security rules (Overbar docs/NETPLAY_SECURITY.md)
        run: sh native/overbar/tests/netsec.sh .
